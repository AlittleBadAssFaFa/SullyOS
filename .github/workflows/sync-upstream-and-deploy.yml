name: Sync upstream

on:
  schedule:
    # 04:30 Asia/Shanghai
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sullyos-upstream-sync
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out personal fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Merge upstream safely
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/qegj567-cloud/SullyOS.git
          git fetch upstream master

          before="$(git rev-parse HEAD)"
          git merge --no-edit upstream/master
          after="$(git rev-parse HEAD)"

          changed=false
          if [[ "$before" != "$after" ]]; then
            changed=true
          fi

          {
            echo "changed=$changed"
            echo "commit=$after"
          } >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.sync.outputs.changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: steps.sync.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run focused regression tests
        if: steps.sync.outputs.changed == 'true'
        run: >-
          pnpm exec vitest run
          utils/proxyWorker.test.ts
          utils/instantPushClient.test.ts
          utils/backupFormat.test.ts
          utils/backupRoundtrip.test.ts
          utils/db.backupChunked.test.ts
          utils/memoryPalace/backupVectorChunked.test.ts

      - name: Build production site
        if: steps.sync.outputs.changed == 'true'
        run: pnpm build

      - name: Push merged upstream commit
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:master

      - name: Summary
        shell: bash
        run: |
          if [[ "${{ steps.sync.outputs.changed }}" == "true" ]]; then
            echo "Upstream sync completed. Cloudflare Pages will deploy the pushed commit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No upstream updates." >> "$GITHUB_STEP_SUMMARY"
          fi
